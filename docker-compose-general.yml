name: general

services:
  # ============================================
  # Backend Compras
  # ============================================
  compras_postgres:
    image: postgres:16.2
    container_name: compras_postgres
    restart: always
    environment:
      POSTGRES_DB: ds_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - compras_postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ds_db"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  compras:
    image: ghcr.io/frre-ds/backend-compras-g01:80d07d09fd0f6197aae14c6a8abadcd2b43ec65f
    container_name: compras
    restart: always
    environment:
      PORT: 8081
      DATABASE_URL: postgresql://postgres:postgres@compras_postgres:5432/ds_db?schema=public
      # Para obtener JWKS desde el contenedor, usar keycloak:8080
      # Para validar, normalizaremos a localhost:8080 para que coincida con el token
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/ds-2025-realm
    ports:
      - "8081:8081"
    networks:
      - shared_net
    depends_on:
      compras_postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ============================================
  # Backend Stock con PostgreSQL (el código usa 'pg')
  # ============================================
  stock_postgres:
    image: postgres:16.2
    container_name: stock_postgres
    restart: always
    environment:
      POSTGRES_DB: shipping_db
      POSTGRES_USER: shipping_user
      POSTGRES_PASSWORD: shipping_pass
      
    ports:
      - "5433:5432"
    volumes:
      - stock_postgres_data:/var/lib/postgresql/data
      # Montar el schema.sql para que PostgreSQL lo ejecute automáticamente al inicializar
      # PostgreSQL ejecuta todos los archivos .sql en /docker-entrypoint-initdb.d/ al crear la base de datos
      - ./stock-DB/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping_user -d shipping_db"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  stock_back:
    # image: ghcr.io/frre-ds/2025-grupo-11-backend-stock:c56e28f4480813ce138b2659c3aa706f4dc2a951
    image: ghcr.io/frre-ds/2025-grupo-11-backend-stock:38d12396b5830f23f18092a04d87d2c7430d5133
    # Esta imagen es la que funciona
    # image: ghcr.io/frre-ds/2025-grupo-11-backend-stock:f5ff36db6851a291c436acc38baae82805c39c67
    container_name: stock_back
    restart: always
    environment:
      # Database - variables individuales para Next.js
      DB_HOST: stock_postgres
      DB_PORT: 5432
      DB_NAME: shipping_db
      DB_USER: shipping_user
      DB_PASSWORD: shipping_pass
      # Database URL (compatible con Prisma y otros)
      DATABASE_URL: postgresql://shipping_user:shipping_pass@stock_postgres:5432/shipping_db
      # Server
      PORT: 8082
      SERVER_PORT: 8082
      # Keycloak configuration - usar localhost:8080 porque el proxy lo redirige a keycloak:8080
      # El token tiene issuer http://localhost:8080, por lo que debemos validar contra localhost:8080
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ds-2025-realm
      KEYCLOAK_REALM: ds-2025-realm
      KEYCLOAK_CLIENT_ID: grupo-11
      KEYCLOAK_CLIENT_SECRET: ef7f0900-8de5-46c0-b813-ce76d61e0158
    ports:
      - "8082:8082"
    networks:
      - shared_net
    depends_on:
      stock_postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Proxy para redirigir localhost:8080 a keycloak:8080 dentro del contenedor stock_back
  stock_keycloak_proxy:
    image: nginx:alpine
    container_name: stock_keycloak_proxy
    restart: always
    network_mode: "service:stock_back"
    volumes:
      - ./api-gateway/stock-keycloak-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak

  # ============================================
  # Backend Logística con MySQL
  # ============================================
  logistica_mysql:
    image: mysql:8.0
    container_name: logistica_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shipping_db
      MYSQL_USER: shipping_user
      MYSQL_PASSWORD: shipping_pass
    ports:
      - "3307:3306"
    volumes:
      - logistica_mysql_data:/var/lib/mysql
    networks:
      - shared_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "shipping_user", "-pshipping_pass"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  logistica_back:
    image: ghcr.io/frre-ds/2025-grupo-03-backend-logistica:376779cae5a75e077b5a2a324bcedbd10bf93da1
    container_name: logistica_back
    restart: always
    environment:
      DB_HOST: logistica_mysql
      DB_PORT: 3306
      DB_USERNAME: shipping_user
      DB_PASSWORD: shipping_pass
      DB_DATABASE: shipping_db
      PORT: 3010
      HOST: 0.0.0.0
      # Keycloak configuration - usar localhost:8080 porque el proxy lo redirige a keycloak:8080
      KEYCLOAK_AUTH_SERVER_URL: http://localhost:8080
      KEYCLOAK_REALM: ds-2025-realm
      # Stock service URL - a través del API Gateway (debe incluir el prefijo /stock)
      STOCK_SERVICE_URL: http://api-gateway:80/stock
    ports:
      - "8083:3010"
    networks:
      - shared_net
    depends_on:
      logistica_mysql:
        condition: service_healthy
      keycloak:
        condition: service_started

  # Proxy para redirigir localhost:8080 a keycloak:8080 dentro del contenedor logistica_back
  logistica_keycloak_proxy:
    image: nginx:alpine
    container_name: logistica_keycloak_proxy
    restart: always
    network_mode: "service:logistica_back"
    volumes:
      - ./api-gateway/logistica-keycloak-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - keycloak

  # ============================================
  # Keycloak con PostgreSQL
  # ============================================
  keycloak_postgres:
    image: postgres:16.2
    container_name: keycloak_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keycloak_db}
      POSTGRES_USER: ${POSTGRES_USER:-keycloak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_pass}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keycloak_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    container_name: keycloak
    command: start --import-realm
    restart: always
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ds2025}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres/${POSTGRES_DB:-keycloak_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-keycloak_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-keycloak_pass}
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import
    networks:
      - shared_net
    depends_on:
      keycloak_postgres:
        condition: service_healthy

  # ============================================
  # Frontend
  # ============================================
  frontend:
    image: ghcr.io/frre-ds/frontend-g01:ce80927f7cd85a6c9f7a41549c2cfd8d8318dcbd
    container_name: frontend
    restart: always
    ports:
      - "8004:80"
    networks:
      - shared_net
    depends_on:
      - api-gateway
      - keycloak

  # ============================================
  # API Gateway (Nginx)
  # ============================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: always
    ports:
      - "8000:80"
      - "443:443"
    volumes:
      - ./api-gateway/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    networks:
      - shared_net
    depends_on:
      - compras
      - stock_back
      - logistica_back

volumes:
  compras_postgres_data:
    driver: local
  stock_postgres_data:
    driver: local
  logistica_mysql_data:
    driver: local
  keycloak_postgres_data:
    driver: local

networks:
  shared_net:
    driver: bridge
