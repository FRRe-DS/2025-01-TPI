name: Build and Publish Frontend Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-docker-package-deploy.yml'
  
  # También se puede ejecutar manualmente
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="$OWNER/frontend-g01"
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_KEYCLOAK_ISSUER=${{ secrets.VITE_KEYCLOAK_ISSUER || 'http://localhost:8080/realms/ds-2025-realm' }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID || 'grupo-11' }}
            VITE_API_GATEWAY_URL=${{ secrets.VITE_API_GATEWAY_URL || 'http://localhost:8000' }}
            VITE_API_BASE=${{ secrets.VITE_API_BASE || 'http://localhost:8081' }}
            VITE_APP_ORIGIN=${{ secrets.VITE_APP_ORIGIN || 'http://localhost:8004' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
      - name: Output image details
        run: |
          echo "✅ Image published successfully!"
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🏷️  Tag: ${{ github.sha }}"

